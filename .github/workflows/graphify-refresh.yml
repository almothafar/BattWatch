name: Graphify Refresh

# Regenerates the tracked knowledge graph in graphify-out/, so that no feature branch has to carry it. Why that matters, and the numbers behind it, are in the
# "Generated Files" section of .claude/guidelines.md — the rule lives there rather than being restated here.
#
# Weekly, not on every push to master. The "Main branch" ruleset requires a pull request plus the `Build & Test` and `Conventional Commit title` checks for any
# change to master, and its bypass list is empty, so a bot commit is not exempt either. Per-merge would mean a pull request and a full Android build after every
# merge, to revalidate a JSON file nothing compiles against. Weekly costs one pull request, and because `graphify update` is AST-only a graph that trails master
# is incomplete rather than wrong — an agent falls back to grep for the symbols it does not know about yet. To go per-merge, add a `push:` trigger below.
#
# The pull request is opened with GITHUB_TOKEN, so its checks are created but held at `action_required` until someone clicks "Approve workflows to run" — the
# same behaviour release-please's pull request has had on every release since 3.2.0. One click per refresh. Handing this action a personal access token would
# remove the click at the cost of storing and rotating a secret.

on:
  schedule:
    # Mondays 03:00 UTC. Dependabot owns Saturday, so the two never open pull requests on the same day.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One refresh at a time — two runs would race to push the same chore/graphify-refresh branch. Not cancel-in-progress: a scheduled refresh should finish.
concurrency:
  group: graphify-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the knowledge graph
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # graphifyy declares requires-python >=3.10; this is just a current, cached runner version.
          python-version: "3.13"

      # Pinned, and pinned to the version that wrote the tracked graph: graphify owns graph.json's format, so an unannounced upgrade would rewrite the whole
      # file inside a routine refresh. Bumping this is a deliberate change, and it should move together with the version developers run locally.
      - name: Install graphify
        run: pip install graphifyy==0.9.48

      # AST-only — no API key, no cost. `graphify label` is the LLM half and deliberately stays out of a scheduled job, because renaming communities spends
      # money on every run; its cadence is tracked separately. No --force either: if the rebuild finds fewer nodes than the tracked graph, graphify refuses to
      # overwrite it, which is the safe outcome — the tree stays clean and the step below opens no pull request.
      - name: Refresh the graph
        run: graphify update .

      # .gitignore already excludes the untracked members of graphify-out/ (graph.html, cache/, the dated snapshots), so add-paths stages only tracked files.
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: graphify-out
          branch: chore/graphify-refresh
          delete-branch: true
          title: "chore: refresh the knowledge graph"
          commit-message: "chore: refresh the knowledge graph"
          body: |
            Scheduled refresh of the generated graph in `graphify-out/`, so that feature branches do not have to carry it.

            AST-only (`graphify update .`): this moves structure, not community names. Renaming communities is `graphify label`, a separate LLM-backed step that this workflow does not run.

            Nothing compiles against these files. The diff is expected to be large and does not need reading.
