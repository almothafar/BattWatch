# AndroidX (Jetifier not needed — all dependencies are already AndroidX)
android.useAndroidX=true

# (optional) memory
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Optimized resource shrinking: R8 shrinks resources alongside code instead of the standalone shrinker running after it.
# Available from AGP 8.12 behind this flag and the default from AGP 9.0, where the opt-out is deprecated (#351).
android.r8.optimizedResourceShrinking=true
